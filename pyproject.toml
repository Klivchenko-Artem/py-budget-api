[project]
name = "budget-api"
version = "1.0.0"
description = "Учёт личных финансов: операции, бюджеты, отчёт за месяц"
requires-python = ">=3.13"

[tool.pytest.ini_options]
# Все тесты асинхронные, помечать каждый декоратором незачем
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# И тесты, и фикстуры живут в одном цикле событий: иначе движок базы,
# созданный в фикстуре уровня сессии, ругается на «другой event loop»
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Русские тексты в сообщениях и комментариях это не «неоднозначные символы»
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Миграции пишет alembic, переформатировать их руками смысла нет
"alembic/versions/*" = ["E501"]
# В тестах и conftest окружение подменяется до импорта приложения это не ошибка
"tests/*" = ["E402"]
